<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="nav">
  <div class="brand">{{ site.author }}</div>
  <ul>
    <li><a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Inicio</a></li>
    <li><a href="{{ '/cv/' | relative_url }}" class="{% if page.url contains 'cv' %}active{% endif %}">CV</a></li>
    <li><a href="{{ '/docencia/' | relative_url }}" class="{% if page.url contains 'docencia' %}active{% endif %}">Docencia</a></li>
    <li><a href="{{ '/investigacion/' | relative_url }}" class="{% if page.url contains 'investigacion' %}active{% endif %}">Investigación</a></li>
    <li><a href="{{ '/#contacto' | relative_url }}">Contacto</a></li>
  </ul>
</header>

{{ content }}

<footer id="contacto">
  <strong>{{ site.author }}</strong>
  <div class="f-rule"></div>
  {{ site.location }}<br>
  {{ site.phone }} · {{ site.email }}
</footer>

</body>
</html>
